name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: build + test (net9.0-windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Uses the version pinned in global.json so CI matches local builds.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test core
        run: dotnet test Voba.Core.Tests/Voba.Core.Tests.csproj -c Release

      - name: Test persistence
        run: dotnet test Voba.Persistence.Tests/Voba.Persistence.Tests.csproj -c Release

      - name: Test app data
        run: dotnet test Voba.AppData.Tests/Voba.AppData.Tests.csproj -c Release

      - name: Test backend
        run: dotnet test Voba.Backend.Tests/Voba.Backend.Tests.csproj -c Release

      - name: Test client
        run: dotnet test Voba.Client.Tests/Voba.Client.Tests.csproj -c Release

      - name: Test seed
        run: dotnet test Voba.Seed.Tests/Voba.Seed.Tests.csproj -c Release

      - name: Build backend acceptance
        run: dotnet build Voba.Backend.AcceptanceTests/Voba.Backend.AcceptanceTests.csproj -c Release

      - name: Build seed
        run: dotnet build Voba.Seed/Voba.Seed.csproj -c Release

      - name: Build model smoke
        run: dotnet build Voba.ModelSmoke/Voba.ModelSmoke.csproj -c Release

      # Full maui workload so the workload check is satisfied for every TFM the
      # csproj declares (iOS/MacCatalyst can't build here, but only need to be
      # installed, not built).
      - name: Install MAUI workload
        run: dotnet workload install maui

      # Select the Windows framework with -f (not -p:TargetFrameworks, which is
      # a global property that leaks into the net8.0 SpoonacularSDK reference and
      # breaks its restore). -f is not propagated to project references.
      - name: Build
        run: dotnet build Voba/Voba.csproj -c Release -f net9.0-windows10.0.19041.0
