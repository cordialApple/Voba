name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: dotnet build (net9.0-windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Uses the version pinned in global.json so CI matches local builds.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install MAUI workload
        run: dotnet workload install maui

      # Override TargetFrameworks to the Windows target only. The csproj also
      # declares net9.0-ios/maccatalyst (macOS-only); without this MSBuild's
      # workload check would demand those workloads even when building Windows.
      - name: Build
        run: dotnet build Voba/Voba.csproj -c Release -p:TargetFrameworks=net9.0-windows10.0.19041.0
